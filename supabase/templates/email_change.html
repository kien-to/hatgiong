<div style="font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #0b1f3a">
  <h2 style="margin: 0 0 12px">Xác nhận email cho Hạt Giống 🌱</h2>
  <p style="margin: 0 0 16px; line-height: 1.5">Nhập mã này vào trang Hạt Giống để hoàn tất tạo tài khoản:</p>
  <p style="margin: 0 0 24px; font-size: 32px; font-weight: 800; letter-spacing: 8px">{{ .Token }}</p>
  <p style="margin: 0 0 16px; line-height: 1.5">Hoặc nhấn vào liên kết: <a href="{{ .SiteURL }}/?token_hash={{ .TokenHash }}&type=email_change" style="color: #00a204">Xác nhận email</a></p>
  <p style="margin: 0; font-size: 13px; color: #6b7280; line-height: 1.5">Mã có hiệu lực trong 1 giờ. Nếu bạn không yêu cầu, hãy bỏ qua email này.</p>
</div>
