app = "hatgiong-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  SUPABASE_URL = "https://lgnpvhtgmiwvhjkjepgd.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vP1Lbe5v6Mk0sb5Wy8gCNg_sWK8TcrM"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
